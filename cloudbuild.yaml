# Pipeline de build y despliegue a Cloud Run (GOB-GCP-STD-01).
#
# Cumple los requisitos del estándar:
#   · Build y push de la imagen a Artifact Registry
#   · Despliegue a Cloud Run
#   · Tag de imagen = $COMMIT_SHA
#   · Variables de sustitución por ambiente
#   · Timeout configurado
#
# ─────────────────────────────────────────────────────────────────────────────
# PENDIENTE DE CONFIRMAR antes del primer despliegue
#
#   _PROJECT_ID    proyecto GCP real de cada ambiente (QAM / PREM / PROD)
#   _REGION        región del Cloud Run
#   _AR_REPO       repositorio de Artifact Registry
#   _RPA_*_URL     URLs de los microservicios RPA por ambiente. Son también el `audience`
#                  del identity token: URL exacta, SIN barra final. Hoy solo existen las de
#                  QAM; PREM y PROD se rellenan cuando esos servicios existan
#   _RPA_GATEWAY_URL  host del API Gateway, si algún día el ingress de los RPA deja de
#                  permitir tráfico directo (hoy no aplica en QAM)
#
# Los valores de abajo son la forma correcta según la convención de nomenclatura del
# estándar, no valores verificados contra la infraestructura.
#
# ─────────────────────────────────────────────────────────────────────────────
# LA CLAVE DE GEMINI VA POR SECRET MANAGER, NO POR --set-env-vars
#
# El secreto `gemini-api-key` debe existir en Secret Manager y la service account de
# ejecución necesita `roles/secretmanager.secretAccessor` sobre él. Se monta como
# variable de entorno de RUNTIME (`--set-secrets`), que es lo que la distingue de una
# variable `VITE_*`: estas últimas se sustituyen dentro del bundle al compilar y quedan
# publicadas en un archivo estático. Ver SECURITY.md, hallazgo H-01.
#
# Sin el secreto el despliegue sigue funcionando: el proxy responde `ai_unavailable` y el
# widget atiende con el banco de preguntas frecuentes.
# ─────────────────────────────────────────────────────────────────────────────

substitutions:
  # Nomenclatura del estándar: servicio Cloud Run = [ambiente]-[módulo]-[microservicio]
  _ENVIRONMENT: "qam"
  _MODULE: "ia"
  _MICROSERVICE: "chatbot-floridablanca"
  _SERVICE_NAME: "${_ENVIRONMENT}-${_MODULE}-${_MICROSERVICE}"

  _REGION: "us-central1"
  _AR_REPO: "cloud-run-source-deploy"

  # Service account de ejecución. Vacío a propósito: el despliegue no pasa
  # `--service-account`, así que Cloud Run usa la SA de compute por omisión,
  # `<NÚMERO-PROYECTO>-compute@developer.gserviceaccount.com`. Ése es el principal al que
  # hay que conceder `roles/run.invoker` sobre los dos RPA (ver el paso 4).
  #
  # Para verla en un servicio ya desplegado:
  #   gcloud run services describe ${_SERVICE_NAME} --region=${_REGION} \
  #     --format="value(spec.template.spec.serviceAccountName)"
  #
  # Conviene una SA dedicada con permisos mínimos cuando plataforma la cree: basta añadir
  # `--service-account=<email>` al paso de despliegue.
  _RUN_SA: ""

  # Recursos por ambiente. QAM arranca en 0 para no gastar en reposo; PREM y PROD
  # mantienen 1 instancia caliente para evitar el arranque en frío al ciudadano.
  _MIN_INSTANCES: "0"
  # Una sola instancia a propósito. El control de admisión que evita saturar el servicio de
  # factura —techo real de 2 trámites simultáneos— cuenta en la memoria del proceso, así que
  # con varias instancias el techo efectivo se multiplica. Con 80 peticiones concurrentes por
  # instancia hay capacidad de sobra para la atención; subirlo exige mover ese contador a
  # Firestore o Redis. Ver docs/INTEGRACION_RPA.md.
  _MAX_INSTANCES: "1"
  _CPU: "1"
  _MEMORY: "512Mi"
  _CONCURRENCY: "80"

  # Un stream SSE de un trámite dura hasta 300s del lado del RPA. Con el timeout por defecto
  # (300s) la plataforma cortaría la conexión justo antes de que llegue el evento de cierre.
  _TIMEOUT: "310s"

  # ── Ingress ────────────────────────────────────────────────────────────────
  # `internal-and-cloud-load-balancing` es lo que exige GOB-GCP-STD-01, y es el valor al que
  # hay que volver. Pero con él el servicio NO es alcanzable en *.run.app: hace falta un
  # balanceador de carga externo por delante, y mientras no exista el widget no carga en
  # ningún portal —ni responden /health ni /version, que devuelven un 404 con HTML de Google.
  #
  # QAM se queda en `all` hasta que plataforma monte el balanceador. Eso deja el proxy de los
  # RPA expuesto a internet: la lista de orígenes no frena una llamada sin cabecera `Origin`
  # (curl, un script), así que el único freno son los límites por IP —30 peticiones/min y 10
  # trámites/hora—. Cada trámite gasta un captcha pagado y puede bloquear un predio.
  #
  # PREM y PROD deben desplegarse con `internal-and-cloud-load-balancing`.
  _INGRESS: "all"

  # ── Prefijo de ruta ────────────────────────────────────────────────────────
  # Son DOS valores y pueden DIFERIR. Asumir que coinciden fue un error: en QAM el
  # balanceador recorta `/apig/qa` antes de llegar al gateway, asi que el navegador y el
  # servidor ven prefijos distintos.
  #
  #   _PUBLIC_BASE_PATH  lo que pide el NAVEGADOR. Se incrusta en el bundle como `base`,
  #                      asi que `index.html` y el CSS del embed se referencian con el.
  #                      Es el prefijo COMPLETO y publico.
  #
  #   _BASE_PATH         lo que RECIBE el servidor, ya recortado por lo que haya delante.
  #                      Se usa para quitarlo al enrutar.
  #
  # Ejemplo real de QAM:
  #   navegador pide  https://pre-mscloud.nexura.com.co/apig/qa/chatbot/floridablanca/...
  #   el servidor ve  /chatbot/floridablanca/...
  #   entonces        _PUBLIC_BASE_PATH: "/apig/qa/chatbot/floridablanca"
  #                   _BASE_PATH:        "/chatbot/floridablanca"
  #
  # Si nada recorta en medio, los dos llevan el mismo valor. VACIOS = servido en la raiz.
  #
  # COMO SE DIAGNOSTICA: si `_PUBLIC_BASE_PATH` esta mal, el JS del embed carga igual
  # —importa su chunk de forma relativa— pero el CSS da 404 y el widget sale SIN ESTILOS.
  # Si `_BASE_PATH` esta mal, no carga nada: todo cae al fallback de SPA.
  _PUBLIC_BASE_PATH: ""
  _BASE_PATH: ""

  # Configuración del widget incrustada en el bundle. Solo valores públicos.
  _CONVERSATION_API_URL: ""
  _PERSISTENCE_MODE: "off"

  # Origen del backend del chatbot visto desde el navegador.
  #
  # OBLIGATORIO cuando el widget va incrustado en un portal de otro dominio, que es el caso
  # de `pruebas-se-floridablanca.nexura.com`: desde una página de ese dominio, una ruta como
  # `/rpa/factura/...` resolvería contra el portal y no contra este servicio, y todos los
  # trámites darían 404.
  #
  # Al montar el balanceador externo con un dominio propio, cambiar este valor por él.
  _BACKEND_ORIGIN: "https://qam-ia-chatbot-floridablanca-58937908768.us-central1.run.app"
  _AI_PROXY_URL: ""

  # ── Microservicios RPA ─────────────────────────────────────────────────────
  # Variables de RUNTIME, nunca de compilación: los servicios exigen IAM, así que los llama
  # el servidor. Como VITE_* no servirían de nada y además quedarían fijas en la imagen.
  #
  # QAM (verificadas):
  #   factura  https://qam-rpa-factura-58937908768.us-central1.run.app
  #   pqrsd    https://qam-rpa-pqrsd-ghlnutfdwq-uc.a.run.app
  # PREM y PROD: pendientes de plataforma. Hoy solo existen los de QAM.
  _RPA_FACTURA_URL: "https://qam-rpa-factura-58937908768.us-central1.run.app"
  _RPA_PQRSD_URL: "https://qam-rpa-pqrsd-ghlnutfdwq-uc.a.run.app"

  # metadata = Cloud Run directo, o gateway con x-google-issuer accounts.google.com.
  # signed_jwt (gateway que exige JWT auto-firmado) NO está implementado: hay que confirmar
  # antes con plataforma cuál de las dos configuraciones tiene el gateway.
  _RPA_AUTH_MODE: "metadata"

  # Host del API Gateway. Vacío = directo a los Cloud Run (QAM). En PREM y PROD el ingress
  # es internal-and-cloud-load-balancing y los Cloud Run no son alcanzables.
  _RPA_GATEWAY_URL: ""

  # strict: un fallo de configuración (401, 403, 404 o variable ausente) corta el arranque,
  # en lugar de aparecer cuando un ciudadano pide su factura.
  _RPA_STARTUP_PROBE: "strict"

  # Control de carga del proxy de los RPA. Detrás hay trámites oficiales irreversibles y
  # captchas pagados, y el proxy es público.
  _RPA_RATE_LIMIT_PER_MINUTE: "30"
  _RPA_EFFECTFUL_LIMIT_PER_HOUR: "10"
  _RPA_MAX_CONCURRENT_TRAMITES: "2"

  # ── Control de gasto de Gemini ─────────────────────────────────────────────
  # Nombre del secreto en Secret Manager que guarda la clave.
  #
  # VACÍO A PROPÓSITO: crear el secreto exige permisos de Secret Manager que no todo el
  # equipo tiene. Mientras esté vacío, el despliegue no monta ninguna clave, el proxy
  # responde `ai_unavailable` y el widget atiende con el banco de preguntas frecuentes.
  # Los trámites de predial y PQRSD no dependen de esto.
  #
  # Al crear el secreto, poner aquí su nombre (`gemini-api-key`) y conceder
  # `roles/secretmanager.secretAccessor` a la SA de ejecución.
  _GEMINI_SECRET: "GEMINI_API_KEY"
  _GEMINI_MODEL: "gemini-2.5-flash-lite"

  # Ráfagas por IP. Frena bots y bucles de reintento.
  _AI_RATE_LIMIT_PER_MINUTE: "10"

  # Ración diaria de respuestas de IA por sesión. Al agotarse, el ciudadano sigue siendo
  # atendido con el banco de preguntas y no ve ningún aviso.
  _AI_DAILY_QUOTA_PER_SESSION: "30"

  # Techo diario de tokens reales de todo el servicio: el cortacircuitos de gasto.
  _AI_DAILY_TOKEN_CEILING: "500000"

  # Portales autorizados a llamar al proxy de IA y al de los RPA, separados por comas. Un
  # valor que empieza por punto es comodín de sufijo (`.floridablanca.gov.co`). El mismo
  # origen que sirve el widget se permite siempre. NUNCA se responde con `*`: quién puede
  # invocar el endpoint es parte del control de gasto, y por el proxy de los RPA pasan
  # trámites oficiales irreversibles.
  #
  # `pruebas-se-floridablanca.nexura.com` va explícito: es donde se prueba el widget
  # embebido y NO cae bajo el comodín `.floridablanca.gov.co` —son dominios distintos—, así
  # que sin él los trámites responderían 403 con `reason: forbidden_origin`.
  _ALLOWED_ORIGINS: ".floridablanca.gov.co,pruebas-se-floridablanca.nexura.com"

  # Saltos de confianza en X-Forwarded-For. 2 = balanceador externo de GCP por delante de
  # Cloud Run (el despliegue previsto). 1 = Cloud Run expuesto directo en *.run.app.
  # Un valor incorrecto no da error: el límite por IP simplemente deja de funcionar.
  _TRUSTED_PROXY_HOPS: "2"

  # ── BD de conversaciones (MySQL/MariaDB) ──────────────────────────────────
  # Registro de chats (tabla `chat`, ver schema.mysql.sql). Igual que con Gemini: la
  # contraseña va por Secret Manager, nunca en `--set-env-vars` en claro (GOB-GCP-STD-01).
  #
  # VACÍOS A PROPÓSITO por ambiente: la instancia de QAM (mysql-mongodb-db-v2, VM propia,
  # no Cloud SQL) todavía no existe para PREM/PROD. Con _DB_HOST vacío el servicio sigue
  # desplegando igual — el backend de conversaciones simplemente no tiene BD configurada.
  #
  # Valores de QAM (creados 2026-09-01, VM mysql-mongodb-db-v2, 10.128.0.14):
  _DB_HOST: "10.128.0.14"
  _DB_PORT: "3306"
  _DB_USER: "user_chatbot_floridablanca"
  _DB_NAME: "ia_chatbot_floridablanca"
  # Nombre del secreto en Secret Manager (no el valor). Requiere el conector VPC
  # `vm-db-connection` en el despliegue (ya incluido mas abajo) para alcanzar la IP interna.
  _DB_PASS_SECRET: "mariadb-v2-user-chatbot-floridablanca-password"

  # Conector VPC para alcanzar la BD (IP interna, no Cloud SQL). Vacío = sin conector,
  # que es el caso si _DB_HOST tambien esta vacio (PREM/PROD hoy).
  _VPC_CONNECTOR: "vm-db-connection"
  _VPC_EGRESS: "private-ranges-only"

  _IMAGE: "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_MICROSERVICE}"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: "1200s"

steps:
  # ── 1. Build de la imagen ──────────────────────────────────────────────────
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_IMAGE}:${COMMIT_SHA}
      - --tag=${_IMAGE}:${_ENVIRONMENT}-latest
      - --build-arg=VITE_SERVICE_NAME=${_MODULE}-${_MICROSERVICE}
      # La versión desplegada es el SHA del commit: identifica sin ambigüedad qué
      # código está sirviendo cada instancia, y es lo que devuelve /version.
      - --build-arg=VITE_SERVICE_VERSION=${SHORT_SHA}
      - --build-arg=VITE_ENVIRONMENT=${_ENVIRONMENT}
      - --build-arg=VITE_GOOGLE_CLOUD_PROJECT=${PROJECT_ID}
      - --build-arg=VITE_CONVERSATION_API_URL=${_CONVERSATION_API_URL}
      - --build-arg=VITE_PERSISTENCE_MODE=${_PERSISTENCE_MODE}
      - --build-arg=VITE_BACKEND_ORIGIN=${_BACKEND_ORIGIN}
      - --build-arg=VITE_BASE_PATH=${_PUBLIC_BASE_PATH}
      - --build-arg=VITE_AI_PROXY_URL=${_AI_PROXY_URL}
      - .

  # ── 2. Push a Artifact Registry ────────────────────────────────────────────
  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, "${_IMAGE}"]
    waitFor: [build]

  # ── 3. Despliegue a Cloud Run ──────────────────────────────────────────────
  #
  # Ingress `internal-and-cloud-load-balancing` según GOB-GCP-STD-01 (nunca `all`).
  #
  # ATENCIÓN: con este ingress el servicio NO es alcanzable directamente desde el
  # navegador de un ciudadano. Como este widget se incrusta en portales públicos,
  # necesita un balanceador de carga externo por delante. Sin él, el chatbot no cargará
  # en los portales municipales.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        # Los secretos son OPCIONALES, cada uno por su lado. Un --set-secrets apuntando a
        # un secreto que no existe tumba el despliegue entero, y ninguno de los dos es
        # indispensable para arrancar: sin Gemini el widget atiende con el banco de
        # preguntas; sin BD, el registro de conversaciones simplemente no se guarda.
        # Se acumulan en una sola lista separada por comas porque --set-secrets no admite
        # repetirse: la segunda vez pisa a la primera en vez de sumarse.
        SECRETS_LIST=""
        if [ -n "${_GEMINI_SECRET}" ]; then
          SECRETS_LIST="GEMINI_API_KEY=${_GEMINI_SECRET}:latest"
        else
          echo "AVISO: _GEMINI_SECRET vacio. Se despliega sin clave de Gemini; el chatbot"
          echo "       respondera con el banco de preguntas frecuentes."
        fi
        if [ -n "${_DB_PASS_SECRET}" ]; then
          if [ -n "$SECRETS_LIST" ]; then
            SECRETS_LIST="${SECRETS_LIST},DB_PASS=${_DB_PASS_SECRET}:latest"
          else
            SECRETS_LIST="DB_PASS=${_DB_PASS_SECRET}:latest"
          fi
        else
          echo "AVISO: _DB_PASS_SECRET vacio. Se despliega sin BD; el registro de"
          echo "       conversaciones queda deshabilitado."
        fi
        SECRET_ARG=""
        if [ -n "$SECRETS_LIST" ]; then
          SECRET_ARG="--set-secrets=${SECRETS_LIST}"
        fi

        # El conector VPC solo hace falta para alcanzar la BD (IP interna). Sin _DB_HOST no
        # tiene sentido pagar el conector, así que se omite el flag por completo en vez de
        # pasarlo vacío (--vpc-connector="" es un error de gcloud, no "sin conector").
        VPC_ARGS=""
        if [ -n "${_DB_HOST}" ] && [ -n "${_VPC_CONNECTOR}" ]; then
          VPC_ARGS="--vpc-connector=${_VPC_CONNECTOR} --vpc-egress=${_VPC_EGRESS}"
        fi

        # No hace falta --no-cpu-throttling: el seguimiento de un trámite ocurre dentro de
        # una petición (el stream SSE la mantiene abierta), así que nunca hay una tarea de
        # fondo esperando CPU entre peticiones. Si alguna vez se añade una, hará falta.
        gcloud run deploy ${_SERVICE_NAME} \
          --image=${_IMAGE}:${COMMIT_SHA} \
          --region=${_REGION} \
          --platform=managed \
          --ingress=${_INGRESS} \
          --port=8080 \
          --min-instances=${_MIN_INSTANCES} \
          --max-instances=${_MAX_INSTANCES} \
          --cpu=${_CPU} \
          --memory=${_MEMORY} \
          --concurrency=${_CONCURRENCY} \
          --timeout=${_TIMEOUT} \
          --set-env-vars="^##^SERVICE_NAME=${_MODULE}-${_MICROSERVICE}##SERVICE_VERSION=${SHORT_SHA}##ENVIRONMENT=${_ENVIRONMENT}##LOG_LEVEL=INFO##GOOGLE_CLOUD_PROJECT=${PROJECT_ID}##GEMINI_MODEL=${_GEMINI_MODEL}##AI_RATE_LIMIT_PER_MINUTE=${_AI_RATE_LIMIT_PER_MINUTE}##AI_DAILY_QUOTA_PER_SESSION=${_AI_DAILY_QUOTA_PER_SESSION}##AI_DAILY_TOKEN_CEILING=${_AI_DAILY_TOKEN_CEILING}##ALLOWED_ORIGINS=${_ALLOWED_ORIGINS}##TRUSTED_PROXY_HOPS=${_TRUSTED_PROXY_HOPS}##BASE_PATH=${_BASE_PATH}##RPA_FACTURA_URL=${_RPA_FACTURA_URL}##RPA_PQRSD_URL=${_RPA_PQRSD_URL}##RPA_AUTH_MODE=${_RPA_AUTH_MODE}##RPA_GATEWAY_URL=${_RPA_GATEWAY_URL}##RPA_STARTUP_PROBE=${_RPA_STARTUP_PROBE}##RPA_RATE_LIMIT_PER_MINUTE=${_RPA_RATE_LIMIT_PER_MINUTE}##RPA_EFFECTFUL_LIMIT_PER_HOUR=${_RPA_EFFECTFUL_LIMIT_PER_HOUR}##RPA_MAX_CONCURRENT_TRAMITES=${_RPA_MAX_CONCURRENT_TRAMITES}##DB_HOST=${_DB_HOST}##DB_PORT=${_DB_PORT}##DB_USER=${_DB_USER}##DB_NAME=${_DB_NAME}" \
          $$SECRET_ARG \
          $$VPC_ARGS \
          --labels=module=${_MODULE},environment=${_ENVIRONMENT},managed-by=cloudbuild \
          --quiet
    waitFor: [push]

# ─────────────────────────────────────────────────────────────────────────────
# PASO 4 — PERMISOS IAM: FUERA DE ESTE PIPELINE, A PROPÓSITO
#
# La service account de ejecución del chatbot necesita `roles/run.invoker` sobre los DOS
# servicios RPA. Sin ese rol el token es válido y la respuesta es 403.
#
# No se concede desde aquí porque los RPA viven en su propio proyecto y esta cuenta de
# Cloud Build no tiene permiso para modificar sus políticas. Es una tarea de plataforma, una
# sola vez por ambiente:
#
#   gcloud run services add-iam-policy-binding qam-rpa-factura #     --region=us-central1 --project=pre-qa-functions #     --member="serviceAccount:<SA-DEL-CHATBOT>" --role="roles/run.invoker"
#
#   gcloud run services add-iam-policy-binding qam-rpa-pqrsd #     --region=us-central1 --project=pre-qa-functions #     --member="serviceAccount:<SA-DEL-CHATBOT>" --role="roles/run.invoker"
#
# Si el gateway de PREM/PROD exige un JWT auto-firmado, hace falta además
# `roles/iam.serviceAccountTokenCreator` de la SA sobre sí misma. Confirmar antes con
# plataforma: ver docs/INTEGRACION_RPA.md.
#
# La sonda de arranque (RPA_STARTUP_PROBE=strict) detecta el rol ausente en el primer
# despliegue: el contenedor no arranca y el log dice `rpa_probe_fatal` con el 403.
# ─────────────────────────────────────────────────────────────────────────────

images:
  - "${_IMAGE}:${COMMIT_SHA}"
  - "${_IMAGE}:${_ENVIRONMENT}-latest"
