<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 660" role="img" aria-label="FlorIA">
  <defs>
    <clipPath id="floriaBubble">
      <rect x="55" y="5" width="700" height="555" rx="62"/>
      <rect x="0" y="150" width="150" height="260" rx="62"/>
      <rect x="650" y="150" width="150" height="260" rx="62"/>
      <path d="M175 460 L62 648 L295 556 Z"/>
    </clipPath>
  </defs>

  <!-- Silueta en trazo teal: las cuatro piezas se pintan del mismo color, asi que los
       solapes no dejan costuras y el borde queda como si fuera una sola figura. -->
  <g fill="#1B9CB0" stroke="#1B9CB0" stroke-width="26" stroke-linejoin="round">
    <rect x="55" y="5" width="700" height="555" rx="62"/>
    <rect x="0" y="150" width="150" height="260" rx="62"/>
    <rect x="650" y="150" width="150" height="260" rx="62"/>
    <path d="M175 460 L62 648 L295 556 Z"/>
  </g>

  <!-- Bandas de la bandera de Floridablanca, recortadas contra la silueta. -->
  <g clip-path="url(#floriaBubble)">
    <rect x="-10" y="-10" width="820" height="680" fill="#244E87"/>
    <path d="M-10 72 L300 126 L300 670 L-10 670 Z" fill="#F7B316"/>
    <path d="M300 126 L810 126 L810 670 L300 670 Z" fill="#12873A"/>
    <rect x="-10" y="470" width="820" height="200" fill="#000000" opacity="0.13"/>
    <path d="M80 100 C86 64 120 46 190 52" fill="none" stroke="#8FA8C7"
          stroke-width="15" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- Diadema: va antes de la cara para que el brazo nazca por detras. -->
  <path d="M186 362 C186 418 222 448 286 436" fill="none" stroke="#F7B316"
        stroke-width="17" stroke-linecap="round"/>

  <rect x="180" y="140" width="485" height="335" rx="58" fill="#FFFFFF"/>

  <path d="M186 386 C190 424 226 448 286 436" fill="none" stroke="#F7B316"
        stroke-width="17" stroke-linecap="round"/>
  <rect x="280" y="410" width="78" height="48" rx="24" fill="#F7B316"/>

  <g fill="#244E87">
    <rect x="301" y="198" width="48" height="100" rx="24"/>
    <rect x="481" y="198" width="48" height="100" rx="24"/>
  </g>
  <path d="M372 338 Q415 392 458 338" fill="none" stroke="#244E87"
        stroke-width="20" stroke-linecap="round"/>
</svg>
